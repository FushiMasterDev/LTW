name: Desktop UI (Windows)

# Chạy form WinForms thật trên Windows, nối vào DesktopHost (SQLite seed) trong cùng máy.
on:
  push:
    paths:
      - "HomestayBooking.Desktop/**"
      - "HomestayBooking.Desktop.Tests/**"
      - "HomestayBooking.DesktopHost/**"
      - "HomestayBooking.Web/DesktopApi/**"
      - "HomestayBooking.Web/Controllers/Api/Desktop/**"
      - ".github/workflows/desktop-ui.yml"
  workflow_dispatch:

jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FUJI_API_URL: http://127.0.0.1:5080
      SCREENSHOT_DIR: ${{ github.workspace }}\screenshots
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: |
          dotnet build HomestayBooking.DesktopHost -c Release
          dotnet build HomestayBooking.Desktop.Tests -c Release

      # Cùng một bước: trên Windows runner tiến trình con bị tắt khi bước kết thúc.
      - name: Start DesktopHost and run UI tests
        shell: pwsh
        run: |
          $env:ASPNETCORE_ENVIRONMENT = "Development"
          Start-Process dotnet -WindowStyle Hidden -ArgumentList @("run", "--no-build", "-c", "Release", "--project", "HomestayBooking.DesktopHost", "--",
            "--urls", $env:FUJI_API_URL, "--DesktopHost:DatabasePath", "$env:RUNNER_TEMP\fuji-ui.db", "--DesktopApi:LoginPermitLimit", "1000", "--Logging:LogLevel:Microsoft.AspNetCore.Hosting.Diagnostics", "Information") `
            -RedirectStandardOutput host.log -RedirectStandardError host.err
          $ready = $false
          for ($i = 0; $i -lt 90 -and -not $ready; $i++) {
            try { Invoke-WebRequest "$env:FUJI_API_URL/swagger/v1/swagger.json" -UseBasicParsing | Out-Null; $ready = $true }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { Get-Content host.log, host.err; exit 1 }
          dotnet test HomestayBooking.Desktop.Tests -c Release --no-build --logger "trx;LogFileName=desktop-ui.trx" --logger "console;verbosity=normal"
          exit $LASTEXITCODE

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui
          path: |
            screenshots/
            host.log
            host.err
            HomestayBooking.Desktop.Tests/TestResults/
